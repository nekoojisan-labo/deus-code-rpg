<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デウス・コード 設定ビューア</title>
<style>
  :root{
    --bg:#0a0e16; --panel:#101725; --panel2:#0c1220; --line:rgba(0,229,255,.22);
    --accent:#00e5ff; --accent2:#facc15; --text:#e6f1f7; --sub:#90a8bb; --ok:#6fe39a; --warn:#ffb84d; --err:#ff6b6b;
    --font:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.6}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0c1424,#0a0e16);border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0;font-size:18px;letter-spacing:.06em}
  h1 small{color:var(--sub);font-size:12px;font-weight:400;margin-left:8px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tab{background:#0c1626;border:1px solid var(--line);color:var(--sub);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{background:rgba(0,229,255,.14);color:#fff;border-color:var(--accent2)}
  main{padding:18px 20px 60px;max-width:1280px;margin:0 auto}
  .view{display:none}.view.active{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card .n{font-size:26px;font-weight:700;color:var(--accent)}
  .card .l{color:var(--sub);font-size:12px;margin-top:2px}
  h2{font-size:15px;border-left:3px solid var(--accent2);padding-left:8px;margin:22px 0 10px}
  table{width:100%;border-collapse:collapse;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
  th{background:#0e1828;color:var(--accent);font-size:11px;letter-spacing:.04em;position:sticky;top:0}
  tr:hover td{background:rgba(0,229,255,.05)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:rgba(0,229,255,.12);color:var(--accent);margin:1px}
  .pill.warn{background:rgba(255,184,77,.15);color:var(--warn)}
  .pill.err{background:rgba(255,107,107,.15);color:var(--err)}
  .pill.ok{background:rgba(111,227,154,.15);color:var(--ok)}
  .pill.boss{background:rgba(250,204,21,.15);color:var(--accent2)}
  .muted{color:var(--sub)}
  .health{display:grid;gap:10px}
  .h-item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px}
  .h-item.ok{border-left-color:var(--ok)}.h-item.err{border-left-color:var(--err)}
  .h-item h3{margin:0 0 4px;font-size:13px}
  .h-item .d{color:var(--sub);font-size:12px}
  details{margin-top:4px}summary{cursor:pointer;color:var(--sub);font-size:11px}
  pre{background:#070b12;border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:11px;color:#bcd}
  .sub2{color:var(--sub);font-size:11px}
  .bar{height:6px;background:#0c1626;border-radius:4px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .err-box{background:rgba(255,107,107,.08);border:1px solid var(--err);color:#ffd;padding:10px;border-radius:8px;margin-bottom:14px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>デウス・コード 設定ビューア <small>RPGツクール風・実データから生成 / 読み取り専用</small></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<!-- ゲーム実データ（index.html と同じ外部JSを読む。各システムをインスタンス化してDBを読む） -->
<script src="item-system.js?v=47"></script>
<script src="equipment-system.js?v=50"></script>
<script src="magic-system.js?v=47"></script>
<script src="se-system.js?v=1"></script>
<script src="ui-panel.js?v=2"></script>
<script src="save-system.js?v=2"></script>
<script src="battle-system.js?v=65"></script>
<script src="map-walkability-data.js?v=12"></script>
<script src="object-catalog.js?v=2"></script>
<script src="map-objects-data.js?v=25"></script>
<script src="map-system.js?v=79"></script>
<script src="party-system.js?v=47"></script>
<script src="quest-system.js?v=7"></script>
<script src="story-events.js?v=56"></script>

<script>
const G = window;
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const safeNew = (C) => { try { return C ? new C() : null; } catch (e) { console.warn('init fail', C && C.name, e); return null; } };
const num = (v) => (v == null || v === '' ? '' : v);
const compact = (v) => {
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? (x.id || x.name || JSON.stringify(x)) : x).join(', ');
  if (typeof v === 'object') return Object.entries(v).map(([k,val]) => `${k}:${val}`).join(' ');
  return String(v);
};

function buildModel() {
  const item = safeNew(G.ItemSystem), equip = safeNew(G.EquipmentSystem), magic = safeNew(G.MagicSystem);
  const battle = safeNew(G.BattleSystem), map = safeNew(G.MapSystem), story = safeNew(G.StoryEventSystem);
  const m = {
    errors: [],
    items: (item && item.itemDatabase) || {},
    equipment: (equip && equip.equipmentDatabase) || {},
    magic: (magic && magic.magicDatabase) || {},
    enemies: (battle && battle.enemyDatabase) || {},
    encounterTables: (battle && battle.encounterTables) || {},
    maps: (map && map.maps) || {},
    mapSys: map,
    events: story && story.events ? [...story.events.entries()] : [],
    quests: G.QUEST_STEPS || [],
    questEnding: G.QUEST_ENDING || null,
    characters: G.CHARACTER_DATA || {},
    growth: G.CHARACTER_GROWTH || {},
    save: G.SaveSystem || null
  };
  if (!item) m.errors.push('ItemSystem');
  if (!battle) m.errors.push('BattleSystem'); if (!map) m.errors.push('MapSystem'); if (!story) m.errors.push('StoryEventSystem');
  m.analysis = analyze(m);
  return m;
}

// マップ毎の難易度帯（mapSys.getEncounterZone は currentMap を見るので切り替えて呼ぶ）
function zoneOf(m, id) {
  try { m.mapSys.currentMap = id; return m.mapSys.getEncounterZone(); } catch (e) { return null; }
}

function analyze(m) {
  // 敵↔エンカウントテーブル
  const enemyIds = new Set(Object.keys(m.enemies));
  const tableToEnemies = {}, enemyToTables = {};
  const broken = [];
  Object.keys(m.encounterTables).forEach(tk => {
    tableToEnemies[tk] = [];
    (m.encounterTables[tk] || []).forEach(e => {
      const id = (typeof e === 'string') ? e : (e.id || e.enemyId || e.enemy);
      if (!id) return;
      tableToEnemies[tk].push(id);
      (enemyToTables[id] = enemyToTables[id] || []).push(tk);
      if (!enemyIds.has(id)) broken.push(tk + ' → ' + id);
    });
  });
  const orphanEnemies = [...enemyIds].filter(id => !enemyToTables[id]);
  // テーブル → そのテーブルを使うマップ
  const tableToMaps = {};
  Object.keys(m.maps).forEach(id => {
    const z = zoneOf(m, id);
    if (z && z.table) (tableToMaps[z.table] = tableToMaps[z.table] || []).push(id);
  });
  // マップ内容
  const mapsNoNpc = [], mapsNoExit = [], exitsNoDir = [];
  Object.keys(m.maps).forEach(id => {
    const map = m.maps[id];
    if (!map.npcs || !map.npcs.length) mapsNoNpc.push(id);
    if (!map.exits || !map.exits.length) mapsNoExit.push(id);
    (map.exits || []).forEach(ex => { if (!ex.direction) exitsNoDir.push(id + (ex.to ? '→' + ex.to : '')); });
  });
  // ストーリー
  const eventsNoOneTime = m.events.filter(([, e]) => !e.oneTime).map(([id]) => id);
  const eventsShort = m.events.filter(([, e]) => (e.scenes || []).length <= 1).map(([id]) => id);
  return { enemyToTables, tableToEnemies, tableToMaps, orphanEnemies, broken, mapsNoNpc, mapsNoExit, exitsNoDir, eventsNoOneTime, eventsShort };
}

// ---- 汎用テーブル ----
function tbl(rows, cols) {
  let h = '<table><thead><tr>' + cols.map(c => `<th>${esc(c.label)}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>' + cols.map(c => {
      let v = c.get ? c.get(r) : r[c.key];
      const cls = c.num ? ' class="num"' : '';
      return `<td${cls}>${c.raw ? (v == null ? '' : v) : esc(v == null ? '' : v)}</td>`;
    }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}
const entries = (obj) => Object.keys(obj).map(k => Object.assign({ _id: k }, obj[k]));

// ---- 各タブのレンダラ ----
const VIEWS = {};

VIEWS['概要'] = (m) => {
  const c = (n, l) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const a = m.analysis;
  const warns = a.broken.length + a.mapsNoNpc.length + a.mapsNoExit.length + a.exitsNoDir.length;
  let h = '<div class="cards">' +
    c(Object.keys(m.maps).length, 'マップ') + c(Object.keys(m.enemies).length, '敵') +
    c(Object.keys(m.items).length, 'アイテム') + c(Object.keys(m.equipment).length, '装備') +
    c(Object.keys(m.magic).length, '神威スキル') + c(m.events.length, 'ストーリーイベント') +
    c(m.quests.length, 'クエストステップ') + c(Object.keys(m.characters).length, 'キャラクター') +
    '</div>';
  h += `<h2>ひとめで状態</h2>`;
  h += `<div class="health"><div class="h-item ${a.broken.length ? 'err' : 'ok'}"><h3>${a.broken.length ? '⚠️' : '✅'} データ整合性</h3><div class="d">壊れた敵参照 ${a.broken.length}件 / 構造警告 合計 ${warns}件（詳細は「健全性チェック」タブ）</div></div>`;
  // 章カバレッジ（クエスト章ごとの完了フラグの有無＝物語の骨格がどこまで通っているか）
  const chapters = {};
  m.quests.forEach(q => { const ch = q.chapterTitle || ('第' + q.chapter + '章'); chapters[ch] = (chapters[ch] || 0) + 1; });
  h += `<div class="h-item ok"><h3>📖 章 / クエスト構成</h3><div class="d">` +
    Object.entries(chapters).map(([ch, n]) => `<span class="pill">${esc(ch)}：${n}ステップ</span>`).join(' ') +
    `</div></div></div>`;
  h += `<p class="sub2" style="margin-top:14px">※このビューアは <b>${['item-system','battle-system','map-system','party-system','quest-system','story-events'].join(' / ')}.js</b> ほかゲーム本体の実データを読み込んで表示しています（読み取り専用）。値を変えるには各データファイルを編集してください。</p>`;
  return h;
};

VIEWS['マップ'] = (m) => {
  const rows = Object.keys(m.maps).map(id => {
    const map = m.maps[id]; const z = zoneOf(m, id);
    return {
      id, name: map.name || '', area: map.area || '',
      zone: z ? `T${z.tier} Lv${(z.levelRange || []).join('-')} <span class="sub2">(${z.table})</span>` : '',
      npcs: (map.npcs || []).length, npcNames: (map.npcs || []).map(n => n.name + (n.move ? `<span class="pill">${n.move.type}</span>` : (n.static ? '' : ''))).join('、'),
      exits: (map.exits || []).map(e => `${e.to || '?'}<span class="sub2">${e.direction ? '/' + e.direction : '/<span class="pill warn">無方向</span>'}</span>`).join('　'),
      save: map.savePoint ? '💤' : '', layer: map.objectLayer ? 'object' : 'rect'
    };
  });
  return tbl(rows, [
    { label: 'ID', key: 'id' }, { label: '名前', key: 'name' }, { label: 'エリア', key: 'area' },
    { label: '難易度帯', key: 'zone', raw: true }, { label: 'NPC数', key: 'npcs', num: true },
    { label: 'NPC', key: 'npcNames', raw: true }, { label: '出口', key: 'exits', raw: true },
    { label: 'セーブ', key: 'save' }, { label: '層', key: 'layer' }
  ]);
};

VIEWS['敵'] = (m) => {
  const a = m.analysis;
  const rows = entries(m.enemies).map(e => {
    const tables = a.enemyToTables[e._id];
    const isBoss = !tables;
    return {
      e, isBoss,
      tag: isBoss ? '<span class="pill boss">ボス/召喚</span>' : (tables || []).map(t => `<span class="pill">${t}</span>`).join(''),
      drops: (e.dropTable || []).map(d => `${d.id}<span class="sub2">(${Math.round(d.rate*100)}%)</span>`).join('、')
    };
  });
  return tbl(rows, [
    { label: '', get: r => r.e.emoji }, { label: 'ID', get: r => r.e._id }, { label: '名前', get: r => r.e.name },
    { label: 'HP', num: true, get: r => r.e.hp }, { label: '攻', num: true, get: r => r.e.attack },
    { label: '防', num: true, get: r => r.e.defense }, { label: 'EXP', num: true, get: r => r.e.exp },
    { label: 'G', num: true, get: r => r.e.gold }, { label: '種別', get: r => r.e.type },
    { label: 'スキル', get: r => compact(r.e.skills) }, { label: 'ドロップ', key: 'drops', raw: true },
    { label: '出現', key: 'tag', raw: true }
  ]);
};

VIEWS['アイテム'] = (m) => tbl(entries(m.items), [
  { label: '', key: 'emoji' }, { label: 'ID', key: '_id' }, { label: '名前', key: 'name' },
  { label: '種別', key: 'type' }, { label: '分類', key: 'category' },
  { label: '効果', get: r => compact(r.effect) }, { label: '説明', key: 'description' },
  { label: '価格', key: 'price', num: true }, { label: '売値', key: 'sellPrice', num: true }
]);

VIEWS['装備'] = (m) => tbl(entries(m.equipment), [
  { label: '', key: 'emoji' }, { label: 'ID', key: '_id' }, { label: '名前', key: 'name' },
  { label: 'スロット', get: r => r.slot || r.type }, { label: '攻', key: 'attack', num: true },
  { label: '防', key: 'defense', num: true }, { label: '魔', key: 'magic', num: true },
  { label: '速', key: 'speed', num: true }, { label: '説明', key: 'description' }, { label: '価格', key: 'price', num: true }
]);

VIEWS['神威'] = (m) => tbl(entries(m.magic), [
  { label: '', key: 'emoji' }, { label: 'ID', key: '_id' }, { label: '名前', key: 'name' },
  { label: '種別', key: 'type' }, { label: 'MP', key: 'mpCost', num: true }, { label: '威力', key: 'power', num: true },
  { label: '効果', get: r => compact(r.effect) }, { label: '説明', key: 'description' }, { label: '価格', key: 'price', num: true }
]);

VIEWS['キャラ'] = (m) => {
  const rows = entries(m.characters).map(c => {
    const g = m.growth[c._id] || {};
    const learn = g.skillLearning ? Object.entries(g.skillLearning).map(([lv, sk]) => `Lv${lv}:${[].concat(sk).join(',')}`).join(' ') : '';
    return { c, g, learn };
  });
  return tbl(rows, [
    { label: '', get: r => r.c.sprite || '' }, { label: 'ID', get: r => r.c._id }, { label: '名前', get: r => r.c.name },
    { label: 'Lv', num: true, get: r => r.c.level }, { label: 'HP', num: true, get: r => r.c.maxHp },
    { label: 'MP', num: true, get: r => r.c.maxMp }, { label: '攻', num: true, get: r => r.c.attack },
    { label: '防', num: true, get: r => r.c.defense }, { label: '魔', num: true, get: r => r.c.magic },
    { label: '速', num: true, get: r => r.c.speed }, { label: '初期スキル', get: r => compact(r.c.skills) },
    { label: '成長', get: r => r.g.expCurve || '' }, { label: '習得(Lv)', get: r => r.learn }
  ]);
};

VIEWS['ストーリー'] = (m) => {
  let h = '<h2>クエスト（章の骨格・物語の進行）</h2>';
  h += tbl(m.quests, [
    { label: '章', get: r => r.chapterTitle || ('第' + r.chapter + '章') }, { label: 'ID', key: 'id' },
    { label: 'タイトル', key: 'title' }, { label: '場所', key: 'where' }, { label: '対象マップ', key: 'target' },
    { label: '完了フラグ', get: r => (r.done ? '関数で判定' : '') }
  ]);
  h += '<h2>ストーリーイベント（会話・加入・分岐）</h2>';
  const rows = m.events.map(([id, e]) => ({
    id, trigger: e.trigger || '', oneTime: e.oneTime ? '✓' : '<span class="pill warn">無</span>',
    flags: e.requiredFlags ? compact(e.requiredFlags) : '',
    scenes: (e.scenes || []).length, speakers: [...new Set((e.scenes || []).map(s => s.character).filter(Boolean))].join('、')
  }));
  h += tbl(rows, [
    { label: 'イベントID', key: 'id' }, { label: 'trigger', key: 'trigger' }, { label: '必要フラグ', key: 'flags' },
    { label: 'oneTime', key: 'oneTime', raw: true }, { label: 'シーン数', key: 'scenes', num: true }, { label: '話者', key: 'speakers' }
  ]);
  return h;
};

VIEWS['セーブ'] = (m) => {
  if (!m.save) return '<div class="err-box">SaveSystem を読み込めませんでした</div>';
  let ls; try { ls = window.localStorage; } catch (e) { ls = null; }
  if (!ls) return '<div class="err-box">localStorage にアクセスできません（file:// で開くとオリジンが別になります。GitHub Pages の /game-inspector.html で開くとゲームと同じセーブが見えます）</div>';
  const slots = m.save.listSlots(ls);
  const rows = slots.map((s, i) => ({
    slot: i + 1,
    state: s ? '✅ あり' : '<span class="muted">空</span>',
    loc: s ? s.meta.location : '', lv: s ? s.meta.level : '', party: s ? s.meta.partyCount + '人' : '',
    chapter: s ? s.meta.chapter : '', ts: s ? s.meta.timestamp : ''
  }));
  const legacy = ls.getItem(m.save.LEGACY_KEY) ? 'あり（旧単一セーブ）' : 'なし';
  return tbl(rows, [
    { label: 'スロット', key: 'slot', num: true }, { label: '状態', key: 'state', raw: true },
    { label: '場所', key: 'loc' }, { label: 'Lv', key: 'lv', num: true }, { label: 'パーティ', key: 'party' },
    { label: '章', key: 'chapter' }, { label: '保存日時', key: 'ts' }
  ]) + `<p class="sub2" style="margin-top:10px">旧単一セーブ(${esc(m.save.LEGACY_KEY)})：${legacy}　／　このページとゲームが同一オリジンのときのみセーブが見えます。</p>`;
};

VIEWS['健全性チェック'] = (m) => {
  const a = m.analysis;
  const block = (cls, title, detail) => `<div class="h-item ${cls}"><h3>${title}</h3><div class="d">${detail}</div></div>`;
  let h = '<div class="health">';
  h += block(a.broken.length ? 'err' : 'ok', `${a.broken.length ? '❌' : '✅'} エンカウント→敵DB 参照`, a.broken.length ? '欠落参照: ' + a.broken.map(esc).join(' / ') : 'すべての参照が敵DBに存在します');
  h += block(a.orphanEnemies.length ? '' : 'ok', `${a.orphanEnemies.length ? '⚠️' : '✅'} ランダム出現しない敵`, a.orphanEnemies.length ? '（多くはボス/召喚で正常）: ' + a.orphanEnemies.map(esc).join('、') : 'なし');
  h += block(a.mapsNoNpc.length ? '' : 'ok', `${a.mapsNoNpc.length ? '⚠️' : '✅'} NPCのいないマップ`, a.mapsNoNpc.length ? a.mapsNoNpc.map(esc).join('、') : 'なし');
  h += block(a.mapsNoExit.length ? '' : 'ok', `${a.mapsNoExit.length ? '⚠️' : '✅'} 出口のないマップ`, a.mapsNoExit.length ? a.mapsNoExit.map(esc).join('、') + '（屋内/最深部なら正常）' : 'なし');
  h += block(a.exitsNoDir.length ? '' : 'ok', `${a.exitsNoDir.length ? '⚠️' : '✅'} 方向未設定の出口`, a.exitsNoDir.length ? a.exitsNoDir.slice(0, 20).map(esc).join('、') : 'なし');
  h += block(a.eventsNoOneTime.length ? '' : 'ok', `${a.eventsNoOneTime.length ? '⚠️' : '✅'} oneTime未設定イベント`, a.eventsNoOneTime.length ? a.eventsNoOneTime.map(esc).join('、') + '（再発火の恐れ）' : 'なし');
  h += block(a.eventsShort.length ? '' : 'ok', `ℹ️ シーン1つ以下のイベント`, a.eventsShort.length ? a.eventsShort.map(esc).join('、') + '（短い演出 or 仮置きの可能性）' : 'なし');
  h += '</div>';
  return h;
};

// ---- 起動 ----
function boot() {
  const m = buildModel();
  window._model = m; // デバッグ用
  const tabsEl = document.getElementById('tabs'), mainEl = document.getElementById('main');
  if (m.errors.length) {
    mainEl.insertAdjacentHTML('afterbegin', `<div class="err-box">一部システムを初期化できませんでした: ${esc(m.errors.join(', '))}（その項目は空表示になります）</div>`);
  }
  const names = Object.keys(VIEWS);
  names.forEach((name, i) => {
    const b = document.createElement('button'); b.className = 'tab' + (i === 0 ? ' active' : ''); b.textContent = name;
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      b.classList.add('active'); document.getElementById('view-' + i).classList.add('active');
    };
    tabsEl.appendChild(b);
    const v = document.createElement('div'); v.className = 'view' + (i === 0 ? ' active' : ''); v.id = 'view-' + i;
    try { v.innerHTML = VIEWS[name](m); } catch (e) { v.innerHTML = `<div class="err-box">表示エラー: ${esc(e.message)}</div>`; console.error(e); }
    mainEl.appendChild(v);
  });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
